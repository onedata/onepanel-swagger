get:
  operationId: get_provider_one_s3_status_all
  summary: Get provider OneS3 status on all hosts
  description: Returns status of OneS3 service on each host where it has been deployed.
  x-onedata-gri:
    type: onp_service
    aspect: '{all_hosts_status, <<"ones3">>}'
  tags:
    - Oneprovider Cluster
  produces:
    - application/json
  responses:
    '200':
      description: The status of OneS3 service on each host where it has been deployed.
      schema:
        $ref: '#/definitions/ServiceStatus'
    '401':
      description: Unauthorized request.
    '403':
      description: Forbidden request.
    '404':
      description: OneS3 service has not been deployed.
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  x-code-samples:
  - lang: Shell
    source: onepanel-rest-cli -u onepanel:$PASSPHRASE getProviderOneS3Status --host https://$OP_PANEL_HOST:9443

post:
  operationId: enable_provider_one_s3
  summary: Enable provider OneS3
  description: >
    Enables the OneS3 service on the specified hosts without starting it. 

    NOTE: The admin must first replace the certificates with ones containing 
    the s3 subdomain and then manually [start OneS3](#operation/start_stop_provider_one_s3_all).
  x-onedata-gri:
    type: onp_service
    aspect: ones3_instances
  tags:
    - Oneprovider Cluster
  consumes:
    - application/json
  responses:
    '202':
      $ref: '#/responses/TaskStarted'
    '400':
      description: Invalid request.
      schema:
        $ref: '#/definitions/Error'
    '401':
      description: Unauthorized request.
    '403':
      description: Forbidden request.
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
  - name: oneS3Hosts
    in: body
    description: The OneS3 service hosts configuration.
    schema:
      $ref: '#/definitions/OneS3Hosts'
    required: true
  x-code-samples:
  - lang: Shell
    source: cat ones3_hosts.json | onepanel-rest-cli -u onepanel:$PASSPHRASE enableProviderOneS3 --host https://$OP_PANEL_HOST:9443 -

patch:
  operationId: start_stop_provider_one_s3_all
  summary: Start/stop provider OneS3 on all hosts
  description: Starts or stops OneS3 service on all hosts in the local deployment.
  x-onedata-gri:
    type: onp_service
    aspect: '{start_stop_all, <<"ones3">>}'
  tags:
    - Oneprovider Cluster
  responses:
    '204':
      description: OneS3 server service state changed successfully.
    '401':
      description: Unauthorized request.
    '403':
      description: Forbidden request.
    '404':
      description: OneS3 server service has not been deployed.
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
  - name: started
    in: query
    description: Defines the intended state of the OneS3 server service. The service will be started or stopped in order to match the requested state.
    type: boolean
    default: true
    required: false
  x-code-samples:
  - lang: Shell
    source: onepanel-rest-cli -u onepanel:$PASSPHRASE startStopProviderOneS3All started=false --host https://$OP_PANEL_HOST:9443 
