get:
  operationId: get_ones3_status_on_host
  summary: Get OneS3 service status on a host
  description: Returns the status of the OneS3 service on the selected host.
  x-onedata-gri:
    type: onp_service
    id: ?BINDING(host)
    aspect: '{host_status, <<"ones3">>}'
  tags:
    - Oneprovider Cluster
  produces:
    - application/json
  responses:
    '200':
      description: The status of the OneS3 service on the selected host.
      schema:
        $ref: '#/definitions/ServiceStatusHost'
    '401':
      description: Unauthorized request.
    '403':
      description: Forbidden request.
    '404':
      description: OneS3 service has not been deployed on the selected host.
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
  - name: host
    description: The cluster host for which the OneS3 service status should be returned.
    in: path
    type: string
    required: true
  x-code-samples:
  - lang: Shell
    source: onepanel-rest-cli -u onepanel:$PASSPHRASE getOnes3StatusOnHost host=s3.example.com --host https://$OP_PANEL_HOST:9443

patch:
  operationId: start_stop_ones3_on_host
  summary: Start/stop OneS3 service on a host
  description: |
    Starts or stops the OneS3 service on the selected host in the cluster.
    
    NOTE: the OneS3 service requires that the provider is registered in 
    Onezone before it can be started. If it's not the case, the start
    of the service will be postponed and automatically resumed after the
    registration.
  x-onedata-gri:
    type: onp_service
    id: ?BINDING(host)
    aspect: '{start_stop, <<"ones3">>}'
  tags:
    - Oneprovider Cluster
  responses:
    '204':
      description: OneS3 service state changed successfully.
    '401':
      description: Unauthorized request.
    '403':
      description: Forbidden request.
    '404':
      description: OneS3 service has not been deployed on the selected host.
    '500':
      description: Internal server error.
      schema:
        $ref: '#/definitions/Error'
  parameters:
  - name: host
    description: The cluster host for which OneS3 service status should be changed.
    in: path
    type: string
    required: true
  - name: started
    in: query
    description: >
      Defines the intended state of the OneS3 service. The service will be
      started or stopped in order to match the requested state. Starting
      may be postponed (see the description).
    type: boolean
    default: true
    required: false
  x-code-samples:
  - lang: Shell
    source: onepanel-rest-cli -u onepanel:$PASSPHRASE startStopOnes3OnHost started=false --host https://$OP_PANEL_HOST:9443
