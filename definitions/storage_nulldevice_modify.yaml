description: The Null Device storage configuration.
allOf:
- $ref: '#/definitions/StorageModifyDetails'
- type: object
  properties:
    type:
      type: string
      description: |
        The type of storage.

        `type = "nulldevice"`

        POSIX compatible storage which emulates behavior of `/dev/null` on
        local filesystem. Allows running various performance tests, which are
        not impacted by actual storage latency.
      enum: [nulldevice]
      x-discriminator-value: nulldevice
    latencyMin:
      type: integer
      description: |
        Minimum latency in milliseconds, which should be simulated for
        selected operations.
    latencyMax:
      type: integer
      description: |
        Maximum latency in milliseconds, which should be simulated for
        selected operations.
    timeoutProbability:
      type: number
      format: float
      description: |
        Probability (0.0, 1.0), with which an operation should return
        a timeout error.
    filter:
      type: string
      description: |
        Comma-separated list of filesystem operations, for which latency
        and timeout should be simulated. Empty or '*' mean all operations
        will be affected.
    simulatedFilesystemParameters:
      type: string
      description: |
        Allows simulating a preexisting file/directory tree structure for
        a null device file-system. For example "2-3:4-5:512" will
        generate a filesystem tree which has 2 directories and 3 files
        in the root of the filesystem. Each of these directories will
        have 4 subdirectories and 5 files. Suffix ":512" (which is optional)
        will specify the size of generated files to 512 bytes.
        Default empty string disables the simulated filesystem feature.
    simulatedFilesystemGrowSpeed:
      type: number
      format: float
      description: |
        Determines the simulated filesystem grow rate. Default 0.0 value
        will cause all the files and directories defined by the
        `simulatedFilesystemParameters` specification to be visible immediately.
        For example value of 0.01 will increase the number of the visible
        filesystem entries by 1 file per 100 seconds, while 100.0 will increase it
        by 100 files per second.
    enableDataVerification:
      type: boolean
      default: false
      description: |
        Enables data verification for `read` and `write` operations. Read operations
        will always return a predictable pattern of characters based on `offset` and
        `size`, and `write` operations will fail with I/O error, if the input data
        does not match the pattern at a given `offset`.
  required:
  - type
example:
  type: nulldevice
  name: Slow storage
  latencyMin: 250
  latencyMax: 750
  timeoutProbability: 0.1
  filter: "read,write,open"
  simulatedFilesystemParameters: "2-2:2-2:0-3"
  simulatedFilesystemGrowSpeed: 5.0
