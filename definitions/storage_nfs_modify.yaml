description: The NFS storage configuration.
allOf:
- $ref: '#/definitions/StorageModifyDetails'
- type: object
  properties:
    type:
      type: string
      description: |
        The type of storage.

        `type = "nfs"`

          NFS storage.
      enum: [nfs]
      x-discriminator-value: nfs
    host:
      type: string
      description: The hostname (IP address or FQDN) of NFS server.
    version:
      type: integer
      description: The NFS protocol version. Allowed values are 3 (default) and 4 (experimental).
    volume:
      type: string
      description: The name (path) of the NFS export.
    connectionPoolSize:
      type: integer
      description: >
        Number of simultaneous network connections that can be maintained
        with the NFS server.
    dirCache:
      type: boolean
      description: >
        Enables caching of directory metadata on the client side to improve
        performance by reducing requests to the NFS server. May cause temporary
        inconsistencies if the directory content changes on the server.
    readAhead:
      type: integer
      description: >
        The amount of data that the system preloads into cache ahead of client requests.
    autoReconnect:
      type: integer
      description: The number of automatic reconnect attempts to the server. Setting `-1` enables infinite number of reconnects.
  required:
  - type
example:
  type: nfs
  name: SomeNFS
  volume: /nfs/nfsvolume/
  host: nfs.example.com
  version: 3
  dirCache: false
  readAhead: 1024
  autoReconnect: 5
