type: object
description: The service hosts configuration.
properties:
  hosts:
    type: array
    description: The list of hosts where service should be deployed.
    items:
      type: string
  serverQuota:
    type: integer
    description: |
      The server quota is the RAM memory in MiB that is allocated to the server
      when Couchbase Server is first installed. This sets the limit of RAM
      allocated by Couchbase for caching data for all buckets on each of the nodes. 
      Optional, defaults to `4096` (4 GiB).

      NOTE: This parameter is taken into account only during the initial cluster 
      deployment and ignored when adding new hosts to the cluster.
  bucketQuota:
    type: integer
    description: |
      The bucket quota is the amount of RAM memory in MiB allocated to each
      individual bucket for caching data. Optional, defaults to `4096` (4 GiB). 
      Optimally, should be set to the same value as `serverQuota`.

      NOTE: This parameter is taken into account only during the initial cluster 
      deployment and ignored when adding new hosts to the cluster.
required:
  - hosts
example:
  hosts:
    - node1.example.com
    - node2.example.com
    - node3.example.com
