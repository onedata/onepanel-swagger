type: object
description: The service hosts configuration.
properties:
  hosts:
    type: array
    description: The list of hosts where service should be deployed.
    items:
      type: string
  port:
    type: integer
    description: >
      The port on which the OneS3 service will be available.

      NOTE: This is used only for first deployment and ignored when adding new 
      hosts for the service.
required:
  - hosts
example:
  hosts:
    - node1.example.com
    - node2.example.com
    - node3.example.com
  port: 4443
