type: object
description: The service hosts configuration.
properties:
  hosts:
    type: array
    description: The list of hosts where service should be deployed.
    items:
      type: string
  port:
    type: integer
    description: |
      The port on which the OneS3 service will be available.

      NOTE: This parameter is considered only during the initial cluster
      deployment or when adding the OneS3 service for the first time. In all
      other cases, it is ignored, and the port will default to that of the
      already deployed OneS3 services in the cluster.
required:
  - hosts
example:
  hosts:
    - node1.example.com
    - node2.example.com
    - node3.example.com
  port: 4443
