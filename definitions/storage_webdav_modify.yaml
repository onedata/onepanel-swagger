description: The WebDAV storage configuration.
allOf:
- $ref: '#/definitions/StorageModifyDetails'
- type: object
  properties:
    type:
      type: string
      description: |
        The type of storage.

        `type = "webdav"`

        Storage backend compatible with
        [WebDAV](https://tools.ietf.org/html/rfc4918) protocol.
      enum: [webdav]
      x-discriminator-value: webdav
    endpoint:
      type: string
      description: >
        Full URL of the WebDAV server, including scheme (http or https) and path.
    verifyServerCertificate:
      type: boolean
      description: >
        Determines whether Oneprovider should verify the certificate of
        the WebDAV server.
    credentialsType:
      type: string
      description: >
        Determines what credentials will be used to authorize access
        to the WebDAV storage backend. For public endpoints, select "none".
      enum: [none, basic, token]
    credentials:
      type: string
      description: >
        The credentials to authenticate with the WebDAV server. `basic` credentials
        should be provided in the form `username:password`, for `token` just the token.
        For `none` this field is ignored.
    authorizationHeader:
      type: string
      description: >
        Header format for passing the API/access token to the backend storage server.
        The token will be inserted in place of "{}". Use a colon to
        separate the header name and value, e.g. "X-API-Token: {}".
    rangeWriteSupport:
      type: string
      description: >
        Required for write-enabled supports; the storage backend must support
        at least one range write method. The baseline WebDAV protocol does not
        support range writes and only allows a write-once approach,
        which is incompatible with the Onedata filesystem, as it
        permits partial file modifications.
      enum: [none, moddav, sabredav]
    connectionPoolSize:
      type: integer
      description: >
        Defines the maximum number of parallel connections for a single WebDAV storage.
    maximumUploadSize:
      type: integer
      description: >
        Defines the maximum upload size for a single `PUT` or `PATCH` request. If set to 0,
        assumes that the WebDAV server has no upload limit.
    fileMode:
      type: string
      description: >
        Defines the file permissions, which files imported from WebDAV storage will have
        in Onedata. Values should be provided in octal format e.g. `0644`.
    dirMode:
      type: string
      description: >
        Defines the directory mode which directories imported from WebDAV storage will
        have in Onedata. Values should be provided in octal format e.g. `0775`.
  required:
  - type
example:
  type: webdav
  name: SomeWebDAV
  endpoint: https://192.168.1.2:8080/webdav
  verifyServerCertificate: false
  credentialsType: basic
  credentials: "admin:password"
  rangeWriteSupport: moddav
  connectionPoolSize: 25
  maximumUploadSize: 0
