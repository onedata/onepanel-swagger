description: The HTTP storage configuration.
x-onedata-storage: true
allOf:
  - $ref: '#/definitions/StorageGetDetails'
  - $ref: '#/definitions/StorageCreateDetails'
  - type: object
    properties:
      type:
        type: string
        description: |
          The type of storage.

          `type = "http"`

          Any [HTTP](https://tools.ietf.org/html/rfc7231) or HTTPS compatible
          server. Supported only with Readonly option enabled and in manual
          import mode.
        enum: [http]
        x-discriminator-value: http
      endpoint:
        type: string
        description: >
          Base URL of the HTTP server, including scheme (`http` or `https`) and
          optional path prefix. When registering files by relative path in
          `storageFileId`, that path is appended to this URL.
          **Note:** A full URI supplied as `storageFileId` always takes precedence
          and bypasses this endpoint, allowing files from any HTTP server reachable
          by the Oneprovider to be registered.
      verifyServerCertificate:
        type: boolean
        description: >
            Determines whether Oneprovider should verify the certificate of
            the HTTP server.
        default: true
        x-onedata-default-value: true
      authorizationHeader:
        type: string
        description: >
          Header format for passing the API/access token to the backend storage server.
          The token will be inserted in place of "{}". Use a colon to separate
          the header name and value, e.g. "X-API-Token: {}".
        default: "Authorization: Bearer {}"
        x-onedata-default-value: '<<"Authorization: Bearer {}">>'
      connectionPoolSize:
        type: integer
        description: >
            Defines the maximum number of parallel connections for a single HTTP storage.
        default: 150
        x-onedata-default-value: 150
      maxRequestsPerSession:
        type: integer
        description: >
            Defines the maximum number of requests performed in a single HTTP session.
            After the limit is reached, 'Connection: close' header is sent to the server.
            When set to 0 (default), number of requests per session is unlimited, unless
            imposed by the server.
        default: 0
        x-onedata-default-value: 0
      emulateRangeRead:
        type: boolean
        description: >
          Enables fallback emulation of range reads for HTTP servers that do not
          support the `Range` header. When active, the full file content is
          downloaded and only the requested byte range is returned to the caller.
          Has no effect on servers that support range reads natively.
          **Warning:** Emulation causes significant performance degradation and
          increased memory usage; enable only as a last resort.
        default: false
        x-onedata-default-value: false
      maxEmulatedRangeReadFileSize:
        type: integer
        description: >
          Maximum file size in bytes eligible for emulated range reads.
          Files exceeding this limit cannot be accessed from servers that lack
          native range read support. Has no effect unless `emulateRangeRead`
          is `true`.
        default: 67108864
        x-onedata-default-value: 67108864
      fileMode:
        type: string
        description: >
          Defines the file permissions, which files imported from HTTP storage will have
          in Onedata. Values should be provided in octal format e.g. `0664`.
        default: "0664"
      storagePathType:
        type: string
        default: canonical
        x-onedata-default-value: '<<"canonical">>'
        description: |
          Determines how the logical file paths will be mapped on the storage.
          'canonical' paths reflect the logical file names and directory structure,
          however each rename operation will require renaming the files on the storage.
          'flat' paths are based on unique file UUID's and do not require on-storage
          rename when logical file name is changed.
    required:
    - type
    - endpoint
  - $ref: '#/definitions/HTTPCredentials'
example:
  type: http
  name: SomeHTTP
  endpoint: https://192.168.1.2:8080/storage
  verifyServerCertificate: false
  credentialsType: basic
  credentials: "admin:password"
  connectionPoolSize: 25
example:
  type: http
  name: SomeHTTP
  endpoint: https://192.168.1.2:8080/storage
  verifyServerCertificate: false
  credentialsType: token
  credentials: "9uIG9uZXpvbmUKMDAzMGlkZW500aWZpZXIgMDc00CB00aW1lIDwgMTU3MDY2ZkZWVhNDIxMzE3ZGU5YzdiMGUzZDVhYTFmNmMKMDAxYW"
  authorizationHeader: "X-Auth-Token: {}"
  connectionPoolSize: 25
example:
  type: http
  name: SomeHTTP
  endpoint: https://192.168.1.2:8080/storage
  verifyServerCertificate: false
  credentialsType: oauth2
  credentials: "eudat"
  oauth2IdP: b2access
  onedataAccessToken: MDAxNWxvY2F10aW9uIG9uZXpvbmUKMDAzMGlkZW500aWZpZXIgMDc00CB00aW1lIDwgMTU3MDY2ZkZWVhNDIxMzE3ZGU5YzdiMGUzZDVhYTFmNmMKMDAxYWNpZEwMzI4NQowMDJmc2lnbmF00dXJlIGTFnkfXYWEJ5PXUHYVJJIeOt4qdJ2LHeFL6r5OEYkgKCg
  rangeWriteSupport: moddav
  connectionPoolSize: 25
  maximumUploadSize: 0
example:
  type: http
  name: SomeHTTP
  endpoint: https://192.168.1.2:8080/storage
  verifyServerCertificate: false
  credentialsType: oauth2
  credentials: "eudat"
  oauth2IdP: b2access
  connectionPoolSize: 25
