description: The Ceph storage configuration (uses librados).
x-onedata-storage: true
allOf:
  - $ref: '#/definitions/StorageGetDetails'
  - $ref: '#/definitions/StorageCreateDetails'
  - type: object
    properties:
      type:
        type: string
        description: |
          The type of storage.

          `type = "cephrados"`

          Storage backend compatible with [Ceph](http://ceph.com/ceph-storage/)
          object storage.
        enum: [cephrados]
        x-discriminator-value: cephrados
      monitorHostname:
        type: string
        description: >
          The hostname (IP address or FQDN) of the Ceph monitor service.
      clusterName:
        type: string
        description: The name of the Ceph storage cluster.
      poolName:
        type: string
        description: >
          The name of the Ceph pool – the logical partition for object storage.
      blockSize:
        type: integer
        description: >
          Each file will be split across a number of Ceph RADOS objects
          of the specified size. For optimal performance, this value should be equal
          to the object size configured in a given Ceph Storage Cluster (default 4M).
        default: 4194304
        x-onedata-default-value: 4194304
      storagePathType:
        type: string
        default: flat
        x-onedata-default-value: '<<"flat">>'
        description: |
          Determines how the logical file paths will be mapped on the storage.
          'canonical' paths reflect the logical file names and directory structure,
          however each rename operation will require renaming the files on the storage.
          'flat' paths are based on unique file UUID's and do not require on-storage
          rename when logical file name is changed.
        enum: [flat]
    required:
    - type
    - monitorHostname
    - clusterName
    - poolName
  - $ref: '#/definitions/CephradosCredentials'
example:
  type: cephrados
  name: SomeCeph
  username: user1
  key: 4efb70ad3e1fc8dd73c721b8f683b2e831503892
  monitorHostname: test.example.com
  clusterName: CephCluster1
  poolName: data
  blockSize: 10485760
