description: The Ceph storage configuration (uses librados).
allOf:
- $ref: '#/definitions/StorageModifyDetails'
- type: object
  properties:
    type:
      type: string
      description: |
        The type of storage.

        `type = "cephrados"`

        Storage backend compatible with [Ceph](http://ceph.com/ceph-storage/)
        object storage.
      enum: [cephrados]
      x-discriminator-value: cephrados
    username:
      type: string
      description: The username of the Ceph cluster administrator.
    key:
      type: string
      description: The admin key to access the Ceph cluster.
    monitorHostname:
      type: string
      description: The hostname (IP address or FQDN) of the Ceph monitor service.
    clusterName:
      type: string
      description: The name of the Ceph storage cluster.
    poolName:
      type: string
      description: >
        The name of the Ceph pool – the logical partition for object storage.
  required:
  - type
example:
  type: cephrados
  name: SomeCeph
  username: user1
  key: 4efb70ad3e1fc8dd73c721b8f683b2e831503892
  monitorHostname: test.example.com
  clusterName: CephCluster1
  poolName: data