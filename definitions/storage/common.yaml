# Common field definitions for storage details

name:
  type: string
  description: The name of storage.

id:
  type: string
  description: The Id of storage.

verificationPassed:
  type: boolean
  description: |
    Whether the storage passed the test that a PATCH request runs before it
    modifies the storage. Returned only in a response to a PATCH request.

    * `true` - the storage has been modified: it passed the test, or the
      request needed none.
    * `false` - the storage failed the test and has not been modified.

    The test depends on the request:

    * no test - the request changes nothing but `name` and `qosParameters`,
      or the storage is of type `http` or `nulldevice`;
    * access to the storage from every Oneprovider node - after the
      modification, the storage is read-only, or is imported and supports
      a space;
    * access, then the creation, write, read and removal of a test file from
      every Oneprovider node - in any other case.

timeout:
  type: integer
  description: >
    Maximum time to wait for a response from the storage service
    before the request is aborted.
  x-onedata-runtime-mutable: true

lumaFeed:
  type: string
  description: >
    Type of feed for LUMA DB.
    Feed is a source of user/group mappings used to populate the LUMA DB.
    For more info please read: https://onedata.org/#/home/documentation/doc/administering_onedata/luma.html
  enum:
    - auto
    - local
    - external
  x-onedata-runtime-mutable: true

lumaFeedUrl:
  type: string
  description: URL of external feed for LUMA DB. Relevant only if lumaFeed equals `external`.
  x-onedata-runtime-mutable: true

lumaFeedApiKey:
  type: string
  description: >
    API key checked by external service used as feed for LUMA DB.
    Relevant only if lumaFeed equals `external`.
  x-onedata-runtime-mutable: true

qosParameters:
  description: Map with key-value pairs used for describing storage QoS parameters.
  type: object
  x-onedata-dictionary: true
  x-onedata-dictionary-value-type: string
  additionalProperties:
    type: string
  x-onedata-runtime-mutable: true

importedStorage:
  type: boolean
  description: >
    Defines whether storage contains existing data to be imported.

readonly:
  type: boolean
  description: >
    Defines whether the storage is readonly. If enabled, Oneprovider will block any operation that writes,
    modifies or deletes data on the storage. Such storage can only be used to import data into the space.
    Mandatory to ensure proper behaviour if the backend storage is actually configured as readonly.
    This option is available only for imported storages.
