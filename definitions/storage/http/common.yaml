# Common field definitions for HTTP storage

type:
  type: string
  description: |
    The type of storage.

    `type = "http"`

    Any [HTTP](https://tools.ietf.org/html/rfc7231) or HTTPS compatible
    server. Supported only with Readonly option enabled and in manual
    import mode.
  enum: [http]
  x-discriminator-value: http

endpoint:
  type: string
  description: >
    Full URL of the HTTP server, including scheme (http or https) and path.

verifyServerCertificate:
  type: boolean
  description: >
    Determines whether Oneprovider should verify the certificate of
    the HTTP server.

authorizationHeader:
  type: string
  description: >
    The authorization header to be used for passing the access token. This field
    can contain any prefix that should be added to the header value. Default is
    `Authorization: Bearer {}`. The token will be placed where `{}` is provided.

connectionPoolSize:
  type: integer
  description: >
    Defines the maximum number of parallel connections for a single HTTP storage.

maxRequestsPerSession:
  type: integer
  description: >
    Defines the maximum number of requests performed in a single HTTP session.
    After the limit is reached, 'Connection: close' header is sent to the server.
    When set to 0 (default), number of requests per session is unlimited, unless
    imposed by the server.

fileMode:
  type: string
  description: >
    Defines the file permissions, which files imported from HTTP storage will have
    in Onedata. Values should be provided in octal format e.g. `0664`.

storagePathType:
  type: string
  description: |
    Determines how the logical file paths will be mapped on the storage.
    'canonical' paths reflect the logical file names and directory structure,
    however each rename operation will require renaming the files on the storage.
    'flat' paths are based on unique file UUID's and do not require on-storage
    rename when logical file name is changed.

# Credentials fields (also in HTTPCredentials)
credentialsType:
  type: string
  description: >
    Determines the types of credentials provided in the credentials
    field.
  enum: [none, basic, token, oauth2]

credentials:
  type: string
  description: >
    The credentials to authenticate with the HTTP server. `basic` credentials
    should be provided in the form `username:password`, for `token` just the token.
    In case of `oauth2`, this field should contain the username for the HTTP, while
    the token will be obtained and refreshed automatically in the background.
    For `none` this field is ignored.

oauth2IdP:
  type: string
  description: >
    In case `oauth2` credential type is selected and Onezone is configured with support
    for multiple external IdP's, this field must contain the name of the IdP which
    authenticates requests to the HTTP endpoint. If Onezone has only one external IdP,
    it will be selected automatically.

onedataAccessToken:
  type: string
  description: >
    When registering storage with feed of LUMA DB set to `auto` and with `oauth2` external IdP,
    this field must contain a valid Onedata access token of the user on whose behalf the HTTP
    storage will be accessed by all users with access to any space supported by this storage.

