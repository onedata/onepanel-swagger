description: Credentials on the SWIFT storage.
allOf:
- $ref: '#/definitions/LumaStorageCredentials'
- type: object
  properties:
    type:
      description: >
        Type of the storage. Must be given explicitly and must match
        the actual type of subject storage - this redundancy is needed
        due to limitations of OpenAPI polymorphism.
      type: string
      enum: [swift]
      x-discriminator-value: swift
    username:
      $ref: './common.yaml#/username'
    password:
      $ref: './common.yaml#/password'
    projectName:
      $ref: './common.yaml#/projectName'
    userDomainName:
      allOf:
        - $ref: './common.yaml#/userDomainName'
        - default: Default
          x-onedata-default-value: <<"Default">>
    projectDomainName:
      allOf:
        - $ref: './common.yaml#/projectDomainName'
        - default: Default
          x-onedata-default-value: <<"Default">>
  required:
    - type
    - username
    - password
    - projectName
example:
  type: swift
  username: user
  password: p@$$w0rd
  projectName: Project1
  userDomainName: Default
  projectDomainName: Default
