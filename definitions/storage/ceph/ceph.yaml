description: The Ceph storage configuration (uses libradosstriper).
allOf:
  - $ref: '#/definitions/StorageCreateDetails'
  - $ref: '#/definitions/StorageGetDetails'
  - type: object
    properties:
      type:
        type: string
        description: |
          The type of storage.

          `type = "ceph"`

          (**DEPRECATED** - use Ceph RADOS instead) storage backend compatible
          with [Ceph](http://ceph.com/ceph-storage/) object storage, using the
          deprecated `libradosstriper` library.
        enum: [ceph]
        x-discriminator-value: ceph
      monitorHostname:
        type: string
        description: >
          The hostname (IP address or FQDN) of the Ceph monitor service.
      clusterName:
        type: string
        description: The name of the Ceph storage cluster.
      poolName:
        type: string
        description: >
          The name of the Ceph pool – the logical partition for object storage.
      storagePathType:
        type: string
        default: flat
        x-onedata-default-value: '<<"flat">>'
        description: |
          Determines how the logical file paths will be mapped on the storage.
          'canonical' paths reflect the logical file names and directory structure,
          however each rename operation will require renaming the files on the storage.
          'flat' paths are based on unique file UUID's and do not require on-storage
          rename when logical file name is changed.
    required:
    - type
    - monitorHostname
    - clusterName
    - poolName
  - $ref: '#/definitions/CephCredentials'
example:
  type: ceph
  name: SomeCeph
  username: user1
  key: 4efb70ad3e1fc8dd73c721b8f683b2e831503892
  monitorHostname: test.example.com
  clusterName: CephCluster1
  poolName: data