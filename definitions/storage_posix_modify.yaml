description: The POSIX storage configuration.
allOf:
- $ref: '#/definitions/StorageModifyDetails'
- type: object
  properties:
    type:
      type: string
      description: |
        The type of storage.

        `type = "posix"`

        Any POSIX compatible storage, typically attached over high-throughput
        local network, such as NFS.
      enum: [posix]
      x-discriminator-value: posix
    mountPoint:
      type: string
      description: >
        Absolute path to the root directory of the storage file system.
        The directory must exist and be accessible. In containerized deployments,
        this path refers to a location inside the container (Docker/pod) and
        must be mounted referencing an external persistent storage
        (e.g., host file system or network storage), except
        for non-persistent (testing) deployments.
    rootUid:
      type: integer
      description: UID of the user on whose behalf operations in the admin context will be performed on the storage.
    rootGid:
      type: integer
      description: GID of the group on whose behalf operations in the admin context will be performed on the storage.
  required:
  - type
example:
  type: posix
  timeout: 500
